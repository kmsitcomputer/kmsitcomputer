# ─── KMSIT Computer · Nginx (VPS) ────────────────────────────────────────────
# Salin sebagai /etc/nginx/sites-available/kmsit lalu `ln -s` ke sites-enabled.
# Upload seluruh isi folder dist/ ke /var/www/kmsit

server {
    listen 80;
    server_name domainanda.com www.domainanda.com;
    root /var/www/kmsit;
    index index.html;

    # SPA fallback (hash-routing tetap aman tanpa ini)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aset ber-hash: cache agresif
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
